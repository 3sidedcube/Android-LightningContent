plugins {
    id 'groovy'
    id 'java-library'
	id "de.undercouch.download" version "5.7.0"
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Compile against the stable Android Gradle variant API (AndroidComponents / onVariants).
    // compileOnly so the consuming app's own AGP (8.x or 9.x) provides the implementation at runtime.
    compileOnly 'com.android.tools.build:gradle-api:8.13.0'

    implementation 'de.undercouch:gradle-download-task:5.7.0'
    implementation 'io.github.http-builder-ng:http-builder-ng-core:1.0.4'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    testImplementation 'junit:junit:4.13.2'
}

POM_NAME='LightningContentGradlePlugin'
POM_ARTIFACT_ID='content-gradle-plugin'
POM_PACKAGING='jar'
// 2.0.1: adds StormExtension.bypassKey, sent as the x-bypass-key header on the build-time bundle download request.
VERSION_NAME="2.0.1-rc2"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

apply plugin: 'maven-publish'
apply plugin: 'signing'

allprojects {
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

ext.PUBLISHING_URL = properties.get('ANDROID_INTERNAL_PUBLISHING_URL', '')
ext.PUBLISHING_USERNAME = properties.get('ANDROID_INTERNAL_PUBLISHING_USERNAME', '')
ext.PUBLISHING_PASSWORD = properties.get('ANDROID_INTERNAL_PUBLISHING_PASSWORD', '')

afterEvaluate { project ->
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME

                pom {
                    name = POM_NAME
                    packaging = POM_PACKAGING
                    description = POM_DESCRIPTION
                    url = POM_URL

                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }

                    licenses {
                        license {
                            name = POM_LICENSE_NAME
                            url = POM_LICENSE_URL
                            distribution = 'repo'
                        }
                    }

                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                url = PUBLISHING_URL
                allowInsecureProtocol = true
                credentials {
                    username = PUBLISHING_USERNAME
                    password = PUBLISHING_PASSWORD
                }
            }
        }
    }

    signing {
        sign publishing.publications.mavenJava
    }
}